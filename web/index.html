<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Important meta for mobile browser stability -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="inchfast">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>inchfast</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Additional stability for keyboard behaviour */
    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior-y: contain;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

  <!-- ✅ FIX: Prevent Enter key from reloading page -->
  <script>
    document.addEventListener("submit", function (event) {
      event.preventDefault();
      return false;
    }, true);

    document.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && event.target.tagName === "INPUT") {
        event.preventDefault();
      }
    }, true);
  </script>

  <!-- ✅ FIX: Prevent keyboard resize from forcing page rerender -->
  <script>
    let lastHeight = window.innerHeight;

    window.addEventListener("resize", function (event) {
      const newHeight = window.innerHeight;

      // Detect keyboard popup/dismiss
      if (Math.abs(newHeight - lastHeight) > 150) {
        event.stopImmediatePropagation();
      }

      lastHeight = newHeight;
    });
  </script>

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

</body>

</html>
